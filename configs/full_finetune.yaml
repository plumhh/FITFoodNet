# Example full fine-tuning baseline config. Update dataset paths before running.
# In the paper, full fine-tuning reports the best validation setting among tested learning rates.
dataset:
  name: FoodX-251
  type: csv
  data_root: /path/to/FoodX251
  train_csv: /path/to/FoodX251/train_labels.csv
  val_csv: /path/to/FoodX251/val_labels.csv
  class_list: /path/to/FoodX251/class_list.txt
  image_dirs:
    - /path/to/FoodX251/train
    - /path/to/FoodX251/val
    - /path/to/FoodX251/test_set
    - /path/to/FoodX251

model:
  baseline_method: full_finetune
  backbone: dinov3_l
  img_size: 224
  dinov3_repo: /path/to/dinov3
  dinov3_source: local
  dinov3_weight: /path/to/dinov3_vitl16_pretrain.pth

training:
  epochs: 50
  # Total physical batch size before DataParallel split.
  batch_size: 64
  # Override this with --lr when testing candidate learning rates.
  lr: 5.0e-5
  weight_decay: 1.0e-4
  seed: 42
  amp: true
  grad_clip_norm: 0.5

paths:
  exp_name: full_finetune_foodx251
  output_dir: outputs/foodx251_full_finetune
